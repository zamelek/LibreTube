name: Build and release app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v32.1.1"
        required: true
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build, sign and release app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        uses: ilharp/sign-android-release@v2
        id: sign
        with:
          signingKey: ${{ secrets.ANDROID_RELEASE_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Rename apk file
        run: mv "${{ steps.sign.outputs.signedFile }}" "LibreTube-${RELEASE_TAG}.apk"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: "LibreTube-${{ env.RELEASE_TAG }}.apk"
          fail_on_unmatched_files: true
          make_latest: true
